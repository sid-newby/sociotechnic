name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-label:
    name: Release label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number,
            });
            const labels = pr.labels.map(label => label.name)
              .filter(name => name.startsWith('release:'));
            const allowed = ['release:patch', 'release:minor', 'release:none'];
            if (labels.length !== 1 || !allowed.includes(labels[0])) {
              core.setFailed('Choose exactly one: release:patch, release:minor, release:none.');
            }
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
